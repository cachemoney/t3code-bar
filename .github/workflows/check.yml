name: Swift checks (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runner labels, for example '["self-hosted", "t3code-bar"]'.
        type: string
        required: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          # Keyed on the toolchain and manifest only: source changes must reuse
          # the dependency build instead of starting from an empty .build.
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-
      - name: Release build and tests
        run: swift test -c release
      - name: Packaging script syntax
        run: bash -n scripts/build_app.sh scripts/install.sh
