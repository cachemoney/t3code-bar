[package]
name = "bar-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "t3code-bar-bridge"
path = "src/main.rs"

[dependencies]
bar-core = { path = "../bar-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
notify-rust = { path = "../../vendor/notify-rust", default-features = false, features = ["d"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rusqlite = "0.32"
